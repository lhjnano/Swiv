<!doctype html><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=mobile-web-app-capable content=yes>
<title>swiv</title>
<style>
:root{--bg:#0d0f12;--bar:rgba(20,22,26,.82);--fg:#e6e6e6;--dim:#a0a6af;--acc:#3b82f6;
  --tfg:#e6e6e6;--tbg:rgba(13,15,18,.9);--tfont:ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font:14px system-ui,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bar);
  padding-top:max(6px,env(safe-area-inset-top));min-height:36px}
#title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pos{color:var(--dim);font-variant-numeric:tabular-nums}
#view{flex:1;position:relative;overflow:hidden;touch-action:none}
#term{margin:0;padding:2px 4px;font:12px/1.25 var(--tfont);white-space:pre;color:var(--tfg);background:var(--tbg);
  overflow:hidden;height:100%}
#shot{width:100%;height:100%;object-fit:contain;object-position:top;display:block}
#empty{padding:24px;color:var(--dim)}
footer{background:var(--bar);padding:6px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
#keys{display:flex;gap:4px;overflow-x:auto;margin-bottom:6px}
#keys button{flex:none}
form{display:flex;gap:6px}
input{flex:1;min-width:0;font:inherit;padding:9px;border-radius:8px;border:1px solid #333;
  background:#111;color:var(--fg)}
button{font:inherit;padding:8px 11px;border-radius:8px;border:0;background:#2a2f37;color:var(--fg)}
button.go{background:var(--acc);color:#fff}
#files{display:flex;flex-direction:column;height:100%;background:rgba(13,15,18,.78)}
#fbar{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #2a2f37}
#fpath{flex:1;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
#fopen{color:var(--acc);font-size:13px}
#flist{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;touch-action:pan-y}
#flist li{display:flex;gap:8px;align-items:baseline;padding:11px 12px;border-bottom:1px solid #1d2026}
#flist .n{flex:1;word-break:break-all}#flist .m{color:var(--dim);font-size:12px;white-space:nowrap}
#fview{flex:1;border:0;background:#fff;width:100%}
header button{padding:4px 12px;font-size:18px;line-height:1}
#menu{display:flex;gap:6px;padding:6px 10px;background:var(--bar);border-top:1px solid #2a2f37}
header,footer,#menu{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#menu button{flex:1}
.hide{display:none!important}
</style>
<div id=app>
  <header><span id=title>loading</span><span id=pos></span>
    <button id=add type=button aria-label="new">+</button><button id=del type=button aria-label="close card">×</button></header>
  <div id=menu class=hide><button type=button data-k=term>new terminal</button><button type=button data-k=page>new browser</button></div>
  <div id=view><pre id=term class=hide></pre><img id=shot class=hide alt=""><div id=empty class=hide>no terminal or CDP browser found</div>
    <div id=files class=hide><div id=fbar><button id=fup type=button aria-label="up">↑</button><span id=fpath></span>
      <a id=fopen target=_blank rel=noopener class=hide>new tab</a></div>
      <ul id=flist></ul><iframe id=fview class=hide sandbox="allow-scripts allow-popups allow-forms" title="file"></iframe></div></div>
  <footer>
    <div id=keys></div>
    <form id=f><input id=txt autocomplete=off autocapitalize=off spellcheck=false placeholder="type, send = text + Enter"><button class=go>send</button></form>
  </footer>
</div>
<script>
const $=id=>document.getElementById(id);
let cards=[],cur=-1,timer=null,openId=null;
const KEYS=[["Esc","Escape"],["Tab","Tab"],["S-Tab","S-Tab"],["↑","Up"],["↓","Down"],["←","Left"],["→","Right"],["^C","C-c"],["⌫","BSpace"],["⏎","Enter"]];

async function api(path,body){
  const r=await fetch(path,body===undefined?{cache:'no-store'}:{method:'POST',body:JSON.stringify(body),
    headers:{'Content-Type':'application/json'}});
  if(r.status==401){location='/login';throw 0}
  return r;
}
function cell(){
  const c=document.createElement('canvas').getContext('2d');
  c.font=getComputedStyle($('term')).font;
  const fs=parseFloat(getComputedStyle($('term')).fontSize);
  return {w:c.measureText('M').width,h:fs*1.25};
}
function leave(id){if(id) navigator.sendBeacon('/leave',JSON.stringify({id}));}
async function show(i){
  if(!cards.length){$('title').textContent='swiv';$('pos').textContent='';
    for(const e of ['term','shot']) $(e).classList.add('hide'); $('empty').classList.remove('hide'); return;}
  cur=(i+cards.length)%cards.length;
  const c=cards[cur];
  if(openId&&openId!==c.id) leave(openId);
  openId=c.id;
  $('title').textContent=c.title;$('pos').textContent=`${cur+1}/${cards.length}`;
  $('empty').classList.add('hide');
  $('term').classList.toggle('hide',c.kind!=='term');$('shot').classList.toggle('hide',c.kind!=='page'&&c.kind!=='screen');
  $('files').classList.toggle('hide',c.kind!=='files');document.querySelector('footer').classList.toggle('hide',c.kind==='files');
  clearTimeout(timer);
  if(c.kind==='files'){openId=null;if(!$('flist').childElementCount) dir(fpath);return;}
  const v=$('view').getBoundingClientRect();
  if(c.kind==='term'){
    const m=cell();
    await api('/open',{id:c.id,cols:Math.max(20,Math.floor((v.width-8)/m.w)),rows:Math.max(5,Math.floor((v.height-4)/m.h))});
  }else{
    await api('/open',{id:c.id,width:Math.round(v.width),height:Math.round(v.height),dpr:Math.min(2,devicePixelRatio||1)});
  }
  clearTimeout(timer);poll(c.id);
}
async function poll(id){
  if(id!==openId) return;
  const c=cards[cur];
  if(!c||c.kind==='files') return;
  try{
    if(c.kind==='term'){
      const r=await api('/term?id='+encodeURIComponent(id));
      if(r.ok) drawTerm(await r.json());
    }else{
      const r=await api('/shot?id='+encodeURIComponent(id));
      if(r.ok){const u=URL.createObjectURL(await r.blob());const old=$('shot').src;$('shot').src=u;if(old) URL.revokeObjectURL(old);}
    }
  }catch(e){}
  timer=setTimeout(()=>poll(id),c.kind==='term'?500:700);
}
// desktop theme: wallpaper behind everything, terminal colors/font from the gnome-terminal profile
let TH=null;
async function applyTheme(){
  try{TH=await(await api('/theme')).json();}catch(e){return;}
  const st=document.documentElement.style,h=TH.bg.replace('#',''),
    rgb=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)).join(',');
  st.setProperty('--tfg',TH.fg);st.setProperty('--tbg',`rgba(${rgb},${TH.alpha})`);
  if(TH.has_font){
    const f=new FontFace('swivmono','url(/font)');
    try{document.fonts.add(await f.load());st.setProperty('--tfont','swivmono,ui-monospace,monospace');}catch(e){}
  }
  if(TH.wallpaper){
    const fit={zoom:'cover',scaled:'contain',stretched:'100% 100%',centered:'auto',wallpaper:'auto'}[TH.wallpaper_mode]||'cover';
    document.body.style.background=`${TH.wallpaper_color} url(/wallpaper) center/${fit} no-repeat fixed`;
  }
}
function drawTerm(segs){
  const frag=document.createDocumentFragment();
  for(const [text,fg,bg] of segs){
    if(!fg&&!bg||TH&&(fg===TH.fg||!fg)&&(bg===TH.bg||!bg)){frag.append(text);continue;}
    const s=document.createElement('span');s.textContent=text;
    if(fg&&(!TH||fg!==TH.fg)) s.style.color=fg;
    if(bg&&(!TH||bg!==TH.bg)) s.style.background=bg;
    frag.append(s);
  }
  $('term').replaceChildren(frag);
}
async function load(keep){
  const prev=cards[cur]&&cards[cur].id;
  cards=await(await api('/cards')).json();
  let i=Math.max(0,cards.findIndex(c=>c.id===(keep||prev)));
  show(i);
}
// screen cards: point as a fraction of the shown image (object-fit contain, top aligned)
function frac(cx,cy){const im=$('shot'),b=im.getBoundingClientRect();if(!im.naturalWidth) return null;
  const s=Math.min(b.width/im.naturalWidth,b.height/im.naturalHeight),w=im.naturalWidth*s;
  return {fx:(cx-b.left-(b.width-w)/2)/w,fy:(cy-b.top)/(im.naturalHeight*s)};}
function send(ev){const c=cards[cur]; if(c) api('/input',{id:c.id,...ev});}

// gestures: horizontal swipe switches card, tap clicks, vertical drag scrolls pages
let t0=null;
$('view').addEventListener('touchstart',e=>{const t=e.touches[0];t0={x:t.clientX,y:t.clientY,at:Date.now()};},{passive:true});
$('view').addEventListener('touchend',e=>{
  if(!t0) return;
  const t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y,dt=Date.now()-t0.at,c=cards[cur];t0=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>2*Math.abs(dy)&&dt<600){show(cur+(dx<0?1:-1));return;}
  if(!c||c.kind!=='page'&&c.kind!=='screen') return;
  const r=$('view').getBoundingClientRect(),
    p=c.kind==='screen'?frac(t.clientX,t.clientY):{x:t.clientX-r.left,y:t.clientY-r.top};
  if(!p) return;
  if(Math.abs(dx)<10&&Math.abs(dy)<10&&dt<300) send({type:'tap',...p});
  else if(Math.abs(dy)>Math.abs(dx)) send({type:'scroll',...p,dy:-dy*2});
},{passive:true});
document.addEventListener('keydown',e=>{if(e.target===$('txt'))return;if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
$('title').onclick=()=>load();
for(const [label,key] of KEYS){const b=document.createElement('button');b.type='button';b.textContent=label;
  b.onclick=()=>{const c=cards[cur];if(c) send(c.kind==='term'?{key}:{type:'key',key});};$('keys').append(b);}
$('f').onsubmit=e=>{e.preventDefault();const c=cards[cur],text=$('txt').value;if(!c)return;
  if(c.kind==='term') send({text,key:'Enter'}); else {if(text) send({type:'text',text}); send({type:'key',key:'Enter'});}
  $('txt').value='';};
// file card: list folders under the server root, view files in a sandboxed frame
let fpath='',ftok='';
try{fpath=localStorage.getItem('swiv.fpath')||'';}catch(e){}
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const join=(a,b)=>a?a+'/'+b:b;
function size(n){return n<1024?n+'B':n<1048576?(n/1024).toFixed(0)+'K':(n/1048576).toFixed(1)+'M';}
function when(t){const d=new Date(t*1000),now=new Date();
  return d.toDateString()===now.toDateString()?d.toTimeString().slice(0,5):`${d.getMonth()+1}/${d.getDate()}`;}
async function dir(rel){
  const r=await api('/files?path='+encodeURIComponent(rel));
  if(!r.ok){if(rel){fpath='';return dir('');}return;}
  const d=await r.json();fpath=d.path;ftok=d.ftok;
  try{localStorage.setItem('swiv.fpath',fpath);}catch(e){}
  $('fpath').textContent='/'+fpath;closeFile();
  const ul=$('flist');ul.replaceChildren();ul.scrollTop=0;
  for(const e of d.entries){
    const li=document.createElement('li'),n=document.createElement('span'),m=document.createElement('span');
    n.className='n';n.textContent=(e.dir?'📁 ':'')+e.name;m.className='m';
    m.textContent=e.dir?'':`${size(e.size)} · ${when(e.mtime)}`;
    li.append(n,m);li.onclick=()=>e.dir?dir(join(fpath,e.name)):openFile(join(fpath,e.name));ul.append(li);
  }
}
function openFile(rel){
  const u=`/f/${ftok}/${enc(rel)}`;
  $('fview').src=u;$('fopen').href=u;$('fpath').textContent='/'+rel;
  $('flist').classList.add('hide');$('fview').classList.remove('hide');$('fopen').classList.remove('hide');
}
function closeFile(){
  $('fview').classList.add('hide');$('fview').removeAttribute('src');$('fopen').classList.add('hide');
  $('flist').classList.remove('hide');$('fpath').textContent='/'+fpath;
}
$('fup').onclick=()=>{if(!$('fview').classList.contains('hide')) closeFile();
  else if(fpath) dir(fpath.split('/').slice(0,-1).join('/'));};
$('add').onclick=()=>$('menu').classList.toggle('hide');
for(const b of $('menu').querySelectorAll('button')) b.onclick=async()=>{
  $('menu').classList.add('hide');
  const kind=b.dataset.k,body={kind};
  if(kind==='page'){const url=prompt('URL','https://');if(url===null)return;body.url=url;}
  const before=new Set(cards.map(c=>c.id));
  const r=await api('/new',body);if(!r.ok){alert(await r.text());return;}
  for(let i=0;i<15;i++){  // new window shows up in the card list after a moment
    await new Promise(z=>setTimeout(z,500));
    const now=await(await api('/cards')).json(),fresh=now.find(c=>!before.has(c.id)&&c.kind===kind);
    if(fresh){cards=now;show(cards.indexOf(fresh));return;}
  }
  load();
};
$('del').onclick=async()=>{
  const c=cards[cur];if(!c||c.kind==='files'||c.kind==='screen'||!confirm(`close "${c.title}"?`))return;
  clearTimeout(timer);openId=null;
  await api('/close',{id:c.id});
  await new Promise(z=>setTimeout(z,800));
  cards=await(await api('/cards')).json();show(Math.min(cur,cards.length-1));
};
addEventListener('pagehide',()=>leave(openId));
document.addEventListener('visibilitychange',()=>{if(document.hidden){leave(openId);openId=null;clearTimeout(timer);}else load();});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>show(cur),300);});
applyTheme().finally(()=>load());
</script>
