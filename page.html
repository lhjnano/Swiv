<!doctype html><meta charset=utf-8>
<link rel=manifest href=/manifest><link rel=icon href=/icon-192.png>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name=theme-color content=#0b0e0d>
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=mobile-web-app-capable content=yes>
<title>swiv</title>
<style>
:root{--bg:#0b0e0d;--chrome:rgba(12,16,14,.8);--line:rgba(255,255,255,.09);
  --fg:#e8ebe9;--dim:#93a09a;--acc:#3fb26f;--ink:#07120c;--danger:#e2695f;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono','Droid Sans Mono','Noto Sans Mono',monospace;
  --tfg:#e6e6e6;--tbg:rgba(13,15,18,.9);--tfont:ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font:14px/1.45 var(--sans);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100dvh}
header,#menu,footer{background:var(--chrome);backdrop-filter:blur(14px) saturate(1.15);
  -webkit-backdrop-filter:blur(14px) saturate(1.15)}
header{display:flex;align-items:center;gap:10px;padding:5px 8px;
  padding-left:max(8px,env(safe-area-inset-left));padding-top:max(5px,env(safe-area-inset-top));
  padding-right:max(8px,env(safe-area-inset-right));border-bottom:1px solid var(--line)}
#title{flex:1;min-width:0;font:13px/1.3 var(--mono);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;cursor:pointer}
#title::after{content:'';display:inline-block;width:7px;height:14px;margin-left:8px;
  background:var(--acc);vertical-align:-2px;animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
#pos{font:12px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
header button{flex:none;min-width:44px;min-height:44px;border-radius:10px;color:var(--dim);
  background:rgba(255,255,255,.04);font:19px/1 var(--mono)}
header button:hover{background:rgba(255,255,255,.08);color:var(--fg)}
header button:active{transform:scale(.95)}
#del:active{color:var(--danger)}
#ins{width:auto;padding:0 14px;font:12px var(--mono);color:var(--acc);
  border:1px solid rgba(63,178,111,.45)}
#ins:hover{background:rgba(63,178,111,.12);color:var(--acc)}
#menu{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
#menu button{flex:1;min-height:44px;border-radius:10px;font-size:14px;color:var(--fg);
  background:rgba(255,255,255,.05)}
#menu button:hover{background:rgba(255,255,255,.09)}
#view{flex:1;position:relative;overflow:hidden;touch-action:none}
#term{margin:0;padding:6px 8px;font:13px/1.25 var(--tfont);white-space:pre;color:var(--tfg);
  background:var(--tbg);overflow:hidden;height:100%}
#shot{width:100%;height:100%;object-fit:contain;object-position:top;display:block}
#empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;color:var(--dim);font:13px/1.5 var(--mono);padding:24px}
#empty .emark{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;
  display:grid;place-items:center;font:15px var(--mono);color:var(--acc);
  background:rgba(255,255,255,.04)}
#empty .sub{font:12px var(--sans)}
#files{display:flex;flex-direction:column;height:100%;background:rgba(10,14,12,.7);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#fbar{display:flex;align-items:center;gap:6px;padding:6px 8px;min-height:56px;
  border-bottom:1px solid var(--line)}
#fup{min-width:44px;min-height:44px;border-radius:10px;font:18px var(--mono);color:var(--dim);
  background:rgba(255,255,255,.04)}
#fup:hover{background:rgba(255,255,255,.08);color:var(--fg)}
#fpath{flex:1;min-width:0;font:12px var(--mono);color:var(--dim);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
#fopen{flex:none;padding:12px 6px;font:12px var(--mono);color:var(--acc);text-decoration:none}
#flist{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;touch-action:pan-y}
#flist li{display:flex;gap:10px;align-items:baseline;min-height:44px;padding:12px 14px;
  border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
#flist li:hover{background:rgba(255,255,255,.04)}
#flist li:active{background:rgba(255,255,255,.07)}
#flist .n{flex:1;font:13px/1.4 var(--mono);word-break:break-all}
#flist .m{font:11px var(--mono);color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
#fview{flex:1;border:0;background:#fff;width:100%}
footer{padding:8px 10px;padding-left:max(10px,env(safe-area-inset-left));
  padding-right:max(10px,env(safe-area-inset-right));
  padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#keys{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
#keys::-webkit-scrollbar{display:none}
#keys button{flex:none;min-width:44px;min-height:44px;padding:0 12px;border-radius:9px;
  font:13px var(--mono);color:var(--fg);background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07)}
#keys button:active{background:var(--acc);border-color:transparent;color:var(--ink)}
form{display:flex;gap:8px;align-items:stretch}
.pfx{flex:none;align-self:center;font:15px var(--mono);color:var(--acc)}
#txt{flex:1;min-width:0;font:15px var(--mono);color:var(--fg);padding:11px 12px;
  border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  caret-color:var(--acc)}
#txt::placeholder{color:rgba(232,235,233,.45)}
#txt:focus{outline:none;border-color:rgba(63,178,111,.6)}
button{border:0;cursor:pointer;font-family:var(--sans)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#tabs{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;gap:6px;overflow-x:auto;
  padding:6px 8px;background:var(--chrome);border-bottom:1px solid var(--line);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;min-height:32px;padding:0 12px;border-radius:8px;font:12px var(--mono);
  color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--line)}
#tabs button.on{color:var(--ink);background:var(--acc);border-color:transparent}
#desk{position:absolute;inset:0;z-index:2;overflow-y:auto;touch-action:pan-y;
  background:rgba(10,14,12,.7);backdrop-filter:blur(14px)}
#desk div{display:flex;gap:10px;align-items:baseline;min-height:44px;padding:12px 14px;
  border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;font:13px/1.4 var(--mono)}
#desk b{flex:none;color:var(--acc);font-weight:400}
#desk .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
#desk .sub{flex:none;font-size:11px;color:var(--dim)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){#title::after{animation:none}}
@media (min-width:720px){#app{max-width:520px;margin:0 auto;
  box-shadow:-1px 0 0 var(--line),1px 0 0 var(--line)}}
.dim{opacity:.35;pointer-events:none}
</style>
<div id=app>
  <header><span id=title>loading</span><span id=pos></span>
    <button id=ins type=button class=hide>install</button>
    <button id=add type=button aria-label="new card">+</button>
    <button id=del type=button aria-label="close card">×</button></header>
  <div id=menu class=hide><button type=button data-k=term>new terminal</button><button type=button data-k=shell>new shell</button><button type=button data-k=page>new browser</button></div>
  <div id=view><div id=tabs class=hide></div><div id=desk class=hide></div><pre id=term class=hide></pre><img id=shot class=hide alt="">
    <div id=empty class=hide><span class=emark>&gt;_</span>no terminal or CDP browser found<span class=sub>tap + to open one</span></div>
    <div id=files class=hide><div id=fbar><button id=fup type=button aria-label="parent folder">↑</button><span id=fpath></span>
      <a id=fopen target=_blank rel=noopener class=hide>new tab</a></div>
      <ul id=flist></ul><iframe id=fview class=hide sandbox="allow-scripts allow-popups allow-forms" title="file"></iframe></div></div>
  <footer>
    <div id=keys></div>
    <form id=f><span class=pfx aria-hidden=true>$</span><input id=txt autocomplete=off autocapitalize=off spellcheck=false placeholder="type, send = text + Enter"><button class=go>send</button></form>
  </footer>
</div>
<script>
const $=id=>document.getElementById(id);
let cards=[],views=[],tabSel={},cur=-1,timer=null,openId=null,openTab=null;
const KEYS=[["Esc","Escape"],["Tab","Tab"],["S-Tab","S-Tab"],["↑","Up"],["↓","Down"],["←","Left"],["→","Right"],["^C","C-c"],["⌫","BSpace"],["⏎","Enter"]];

async function api(path,body){
  const r=await fetch(path,body===undefined?{cache:'no-store'}:{method:'POST',body:JSON.stringify(body),
    headers:{'Content-Type':'application/json'}});
  if(r.status==401){location='/login';throw 0}
  return r;
}
function cell(){
  const c=document.createElement('canvas').getContext('2d');
  c.font=getComputedStyle($('term')).font;
  const fs=parseFloat(getComputedStyle($('term')).fontSize);
  return {w:c.measureText('M').width,h:fs*1.25};
}
function leave(id){if(id) navigator.sendBeacon('/leave',JSON.stringify({id}));}
// views: one entry per window; terminal tabs fold into their window's view
const GLYPH={files:'\u25a4',shell:'\u276f',term:'\u258c',page:'\u25ce',app:'\u25ec',screen:'\u25a9'};
function buildViews(){
  views=[];tabSel={};
  for(const c of cards){
    if(c.kind==='term'){
      const w=c.id.split('.')[0];
      let v=views.find(x=>x.win===w);
      if(!v){v={win:w,main:c,tabs:[]};views.push(v);}
      v.tabs.push(c);
    }else views.push({win:c.id,main:c,tabs:[c]});
  }
}
function activeTabOf(v){return v.tabs.find(t=>t.id===tabSel[v.win])||v.main;}
function activeCard(){const v=views[cur];return v?activeTabOf(v):null;}
function renderTabs(v){
  const el=$('tabs');el.replaceChildren();
  for(const t of v.tabs){
    const b=document.createElement('button');b.type='button';
    b.textContent=(t.title||'tab').slice(0,18);
    if(t.id===activeTabOf(v).id)b.classList.add('on');
    b.onclick=()=>{tabSel[v.win]=t.id;show(cur);};
    el.append(b);
  }
}
function buildDesk(){
  const el=$('desk');el.replaceChildren();
  views.forEach((v,i)=>{
    if(v.main.kind==='desk')return;
    const c=activeTabOf(v);
    const row=document.createElement('div');
    const g=document.createElement('b');g.textContent=GLYPH[v.main.kind]||'\u00b7';
    const t=document.createElement('span');t.className='n';t.textContent=c.title||v.main.title;
    row.append(g,t);
    if(v.tabs.length>1){const sp=document.createElement('span');sp.className='sub';
      sp.textContent=v.tabs.length+' tabs';row.append(sp);}
    row.onclick=()=>show(i);
    el.append(row);
  });
}
async function show(i){
  if(!views.length){$('title').textContent='Swiv';$('pos').textContent='';
    for(const e of ['term','shot','tabs','desk']) $(e).classList.add('hide'); $('empty').classList.remove('hide');
    document.querySelector('footer').classList.remove('hide'); return;}
  cur=(i+views.length)%views.length;
  const v=views[cur],c=activeCard();
  if(openId&&openId!==v.win&&openTab) leave(openTab);
  openId=v.win;openTab=c.id;
  $('title').textContent=c.title;$('pos').textContent=`${cur+1}/${views.length}`;
  $('empty').classList.add('hide');
  const k=c.kind;
  $('term').classList.toggle('hide',k!=='term'&&k!=='shell'&&k!=='app');
  $('shot').classList.toggle('hide',k!=='page'&&k!=='screen');
  $('files').classList.toggle('hide',k!=='files');
  $('desk').classList.toggle('hide',k!=='desk');
  $('tabs').classList.toggle('hide',v.tabs.length<2);
  $('del').classList.toggle('dim',k==='files'||k==='screen'||k==='app'||k==='desk');
  document.querySelector('footer').classList.toggle('hide',k==='files'||k==='desk'||k==='app');
  clearTimeout(timer);
  if(k==='desk'){openId=null;openTab=null;buildDesk();return;}
  if(k==='files'){openId=null;openTab=null;if(!$('flist').childElementCount) dir(fpath);return;}
  if(v.tabs.length>1) renderTabs(v);
  const r=$('view').getBoundingClientRect();
  if(k==='term'||k==='shell'){
    const m=cell(),th=v.tabs.length>1?44:0;
    await api('/open',{id:c.id,cols:Math.max(20,Math.floor((r.width-16)/m.w)),rows:Math.max(5,Math.floor((r.height-12-th)/m.h))});
  }else if(k==='page'||k==='screen'){
    await api('/open',{id:c.id,width:Math.round(r.width),height:Math.round(r.height),dpr:Math.min(2,devicePixelRatio||1)});
  }
  clearTimeout(timer);poll(c.id);
}
async function poll(cid){
  const c=activeCard();
  if(!c||c.id!==cid) return;
  try{
    if(c.kind==='term'||c.kind==='shell'||c.kind==='app'){
      const r=await api('/term?id='+encodeURIComponent(cid));
      if(r.ok) drawTerm(await r.json());
    }else{
      const r=await api('/shot?id='+encodeURIComponent(cid));
      if(r.ok){const u=URL.createObjectURL(await r.blob());const old=$('shot').src;$('shot').src=u;if(old) URL.revokeObjectURL(old);}
    }
  }catch(e){}
  timer=setTimeout(()=>poll(cid),(c.kind==='term'||c.kind==='shell')?500:700);
}
// desktop theme: wallpaper behind everything, terminal colors/font from the gnome-terminal profile
let TH=null;
async function applyTheme(){
  try{TH=await(await api('/theme')).json();}catch(e){return;}
  const st=document.documentElement.style,h=TH.bg.replace('#',''),
    rgb=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)).join(',');
  st.setProperty('--tfg',TH.fg);st.setProperty('--tbg',`rgba(${rgb},${TH.alpha})`);
  if(TH.has_font){
    const f=new FontFace('swivmono','url(/font)');
    try{document.fonts.add(await f.load());st.setProperty('--tfont','swivmono,ui-monospace,monospace');}catch(e){}
  }
  if(TH.wallpaper){
    const fit={zoom:'cover',scaled:'contain',stretched:'100% 100%',centered:'auto',wallpaper:'auto'}[TH.wallpaper_mode]||'cover';
    document.body.style.background=`${TH.wallpaper_color} url(/wallpaper) center/${fit} no-repeat fixed`;
  }
}
function drawTerm(segs){
  const frag=document.createDocumentFragment();
  for(const [text,fg,bg] of segs){
    if(!fg&&!bg||TH&&(fg===TH.fg||!fg)&&(bg===TH.bg||!bg)){frag.append(text);continue;}
    const s=document.createElement('span');s.textContent=text;
    if(fg&&(!TH||fg!==TH.fg)) s.style.color=fg;
    if(bg&&(!TH||bg!==TH.bg)) s.style.background=bg;
    frag.append(s);
  }
  $('term').replaceChildren(frag);
}
async function load(keep){
  const prev=keep||(views[cur]&&views[cur].win);
  cards=await(await api('/cards')).json();
  buildViews();
  const i=Math.max(0,views.findIndex(v=>v.win===prev));
  show(i);
}
// screen cards: point as a fraction of the shown image (object-fit contain, top aligned)
function frac(cx,cy){const im=$('shot'),b=im.getBoundingClientRect();if(!im.naturalWidth) return null;
  const s=Math.min(b.width/im.naturalWidth,b.height/im.naturalHeight),w=im.naturalWidth*s;
  return {fx:(cx-b.left-(b.width-w)/2)/w,fy:(cy-b.top)/(im.naturalHeight*s)};}
function send(ev){const c=activeCard(); if(c) api('/input',{id:c.id,...ev});}

// install as an app: the browser offers this only over HTTPS
let insEv=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();insEv=e;$('ins').classList.remove('hide');});
$('ins').onclick=async()=>{if(!insEv) return;insEv.prompt();await insEv.userChoice.catch(()=>{});insEv=null;$('ins').classList.add('hide');};
addEventListener('appinstalled',()=>$('ins').classList.add('hide'));

// gestures: horizontal swipe switches card, tap clicks, vertical drag scrolls pages
let t0=null;
$('view').addEventListener('touchstart',e=>{const t=e.touches[0];t0={x:t.clientX,y:t.clientY,at:Date.now()};},{passive:true});
$('view').addEventListener('touchend',e=>{
  if(!t0) return;
  const t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y,dt=Date.now()-t0.at,c=activeCard();t0=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>2*Math.abs(dy)&&dt<600){show(cur+(dx<0?1:-1));return;}
  if(!c||c.kind!=='page'&&c.kind!=='screen') return;
  const r=$('view').getBoundingClientRect(),
    p=c.kind==='screen'?frac(t.clientX,t.clientY):{x:t.clientX-r.left,y:t.clientY-r.top};
  if(!p) return;
  if(Math.abs(dx)<10&&Math.abs(dy)<10&&dt<300) send({type:'tap',...p});
  else if(Math.abs(dy)>Math.abs(dx)) send({type:'scroll',...p,dy:-dy*2});
},{passive:true});
document.addEventListener('keydown',e=>{if(e.target===$('txt'))return;if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
$('title').onclick=()=>load();
for(const [label,key] of KEYS){const b=document.createElement('button');b.type='button';b.textContent=label;
  b.onclick=()=>{const c=activeCard();if(c) send(c.kind==='term'||c.kind==='shell'?{key}:{type:'key',key});};$('keys').append(b);}
$('f').onsubmit=e=>{e.preventDefault();const c=activeCard(),text=$('txt').value;if(!c)return;
  if(c.kind==='term'||c.kind==='shell') send({text,key:'Enter'}); else {if(text) send({type:'text',text}); send({type:'key',key:'Enter'});}
  $('txt').value='';};
// file card: list folders under the server root, view files in a sandboxed frame
let fpath='',ftok='';
try{fpath=localStorage.getItem('swiv.fpath')||'';}catch(e){}
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const join=(a,b)=>a?a+'/'+b:b;
function size(n){return n<1024?n+'B':n<1048576?(n/1024).toFixed(0)+'K':(n/1048576).toFixed(1)+'M';}
function when(t){const d=new Date(t*1000),now=new Date();
  return d.toDateString()===now.toDateString()?d.toTimeString().slice(0,5):`${d.getMonth()+1}/${d.getDate()}`;}
async function dir(rel){
  const r=await api('/files?path='+encodeURIComponent(rel));
  if(!r.ok){if(rel){fpath='';return dir('');}return;}
  const d=await r.json();fpath=d.path;ftok=d.ftok;
  try{localStorage.setItem('swiv.fpath',fpath);}catch(e){}
  $('fpath').textContent='/'+fpath;closeFile();
  const ul=$('flist');ul.replaceChildren();ul.scrollTop=0;
  for(const e of d.entries){
    const li=document.createElement('li'),n=document.createElement('span'),m=document.createElement('span');
    n.className='n';n.textContent=(e.dir?'📁 ':'')+e.name;m.className='m';
    m.textContent=e.dir?'':`${size(e.size)}  ${when(e.mtime)}`;
    li.append(n,m);li.onclick=()=>e.dir?dir(join(fpath,e.name)):openFile(join(fpath,e.name));ul.append(li);
  }
}
function openFile(rel){
  const u=`/f/${ftok}/${enc(rel)}`;
  // certificates download instead of rendering: open at the top level
  if(/\.(pem|crt|cer|p12|pfx|der)$/i.test(rel)){window.open(u);return;}
  $('fview').src=u;$('fopen').href=u;$('fpath').textContent='/'+rel;
  $('flist').classList.add('hide');$('fview').classList.remove('hide');$('fopen').classList.remove('hide');
}
function closeFile(){
  $('fview').classList.add('hide');$('fview').removeAttribute('src');$('fopen').classList.add('hide');
  $('flist').classList.remove('hide');$('fpath').textContent='/'+fpath;
}
$('fup').onclick=()=>{if(!$('fview').classList.contains('hide')) closeFile();
  else if(fpath) dir(fpath.split('/').slice(0,-1).join('/'));};
$('add').onclick=()=>$('menu').classList.toggle('hide');
for(const b of $('menu').querySelectorAll('button')) b.onclick=async()=>{
  $('menu').classList.add('hide');
  const kind=b.dataset.k,body={kind};
  if(kind==='page'){const url=prompt('URL','https://');if(url===null)return;body.url=url;}
  const before=new Set(cards.map(c=>c.id));
  const r=await api('/new',body);if(!r.ok){alert(await r.text());return;}
  for(let i=0;i<15;i++){  // new window shows up in the card list after a moment
    await new Promise(z=>setTimeout(z,500));
    const now=await(await api('/cards')).json(),fresh=now.find(c=>!before.has(c.id)&&c.kind===kind);
    if(fresh){cards=now;buildViews();show(views.findIndex(v=>v.tabs.some(t=>t.id===fresh.id)));return;}
  }
  load();
};
$('del').onclick=async()=>{
  const c=activeCard();
  if(!c||['files','screen','app','desk'].includes(c.kind)||!confirm(`close "${c.title}"?`))return;
  clearTimeout(timer);openId=null;openTab=null;
  await api('/close',{id:c.id});
  await new Promise(z=>setTimeout(z,800));
  await load();
  show(Math.min(cur,views.length-1));
};
addEventListener('pagehide',()=>leave(openTab));
