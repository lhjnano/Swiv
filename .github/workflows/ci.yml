name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PyGObject and the AT-SPI typelib come from the distro, the rest from pip
      - run: sudo apt-get update && sudo apt-get install -y python3-venv python3-gi gir1.2-atspi-2.0 dbus-x11
      # a session bus lets AT-SPI autolaunch instead of aborting on headless runners
      - run: eval "$(dbus-launch --sh-syntax)" && make test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-venv python3-gi gir1.2-atspi-2.0
      - run: make security
